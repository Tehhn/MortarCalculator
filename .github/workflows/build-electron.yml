name: Build Fire Mission Plotter Desktop App

on:
  push:
    branches: [main]
    paths: ["electron-app/**"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win zip --x64
      - uses: actions/upload-artifact@v4
        with:
          name: FireMissionPlotter-windows
          path: electron-app/dist/*.zip
