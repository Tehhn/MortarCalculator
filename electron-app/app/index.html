<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mortar Distance Calculator</title>
<meta name="description" content="Distance and bearing calculator for the L81 Mortar in Wardogs." />
<meta name="theme-color" content="#0e1a1c" />
<link rel="stylesheet" href="fonts/fonts.css">
<script>
  (function () {
    var root = document.documentElement;
    try {
      var mode = localStorage.getItem('fmp-theme-mode');
      if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode);
    } catch (e) {}
    try {
      // Kept in sync with the FACTIONS object further down — avoids an accent-color flash on load.
      var FACTIONS = {
        blue: { light: '#0042d0', lightStrong: '#0035a6', dark: '#5984e0', darkStrong: '#83a3e8' },
        green: { light: '#068100', lightStrong: '#056700', dark: '#5dad59', darkStrong: '#86c283' },
        red: { light: '#d66969', lightStrong: '#ab5454', dark: '#e49e9e', darkStrong: '#ebb6b6' },
      };
      var faction = FACTIONS[localStorage.getItem('mdc-team')] || FACTIONS.blue;
      var theme = root.getAttribute('data-theme');
      var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var accent = dark ? faction.dark : faction.light;
      root.style.setProperty('--accent', accent);
      root.style.setProperty('--accent-strong', dark ? faction.darkStrong : faction.lightStrong);
      root.style.setProperty('--needle', accent);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #eef0e6;
    --bg-grid: rgba(28,43,58,0.09);
    --bg-grid-major: rgba(28,43,58,0.16);
    --surface: #f8f9f2;
    --surface-2: #ffffff;
    --border: rgba(28,43,58,0.18);
    --ink: #1c2b3a;
    --ink-muted: #56666e;
    --accent: #0042d0;
    --accent-strong: #0035a6;
    --accent-contrast: #fff8f0;
    --needle: #0042d0;
    --danger: #9a2f2f;
    --focus: #2f6f8f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1a1c;
      --bg-grid: rgba(210,230,222,0.07);
      --bg-grid-major: rgba(210,230,222,0.14);
      --surface: #142524;
      --surface-2: #17302d;
      --border: rgba(210,230,222,0.16);
      --ink: #dfeee7;
      --ink-muted: #8ea89d;
      --accent: #5984e0;
      --accent-strong: #83a3e8;
      --accent-contrast: #0d2330;
      --needle: #5984e0;
      --danger: #e08484;
      --focus: #6fc3d9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1a1c;
    --bg-grid: rgba(210,230,222,0.07);
    --bg-grid-major: rgba(210,230,222,0.14);
    --surface: #142524;
    --surface-2: #17302d;
    --border: rgba(210,230,222,0.16);
    --ink: #dfeee7;
    --ink-muted: #8ea89d;
    --accent: #5984e0;
    --accent-strong: #83a3e8;
    --accent-contrast: #0d2330;
    --needle: #5984e0;
    --danger: #e08484;
    --focus: #6fc3d9;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(var(--bg-grid-major) 1px, transparent 1px) 0 0 / 140px 140px,
      linear-gradient(90deg, var(--bg-grid-major) 1px, transparent 1px) 0 0 / 140px 140px,
      var(--bg);
    color: var(--ink);
    font-family: "Titillium Web", "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: max(40px, env(safe-area-inset-top)) 20px max(60px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .masthead {
    text-align: center;
    max-width: 620px;
  }
  .masthead .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 6px;
  }
  .masthead h1 {
    font-family: "Big Shoulders Stencil", "Arial Narrow", sans-serif;
    font-weight: 800;
    font-size: clamp(34px, 5.5vw, 52px);
    letter-spacing: 0.02em;
    margin: 0;
    text-wrap: balance;
    line-height: 0.95;
  }
  .masthead p {
    color: var(--ink-muted);
    font-size: 14.5px;
    line-height: 1.5;
    margin: 10px auto 0;
    max-width: 46ch;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 16px;
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .seg-btn {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    background: var(--surface-2);
    border: none;
    padding: 7px 12px;
    cursor: pointer;
  }
  .seg-btn + .seg-btn { border-left: 1px solid var(--border); }
  .seg-btn.active { background: var(--accent); color: var(--accent-contrast); }
  .seg-btn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .board-row {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 20px;
    width: 100%;
    max-width: 1040px;
  }
  .team-panel {
    flex: none;
    width: 168px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 1px 0 var(--border), 0 18px 40px -28px rgba(0,0,0,0.5);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .team-swatches {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .team-swatch {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    color: var(--ink-muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .team-swatch .swatch-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex: none;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .team-swatch.active {
    border-color: var(--focus);
    color: var(--ink);
    font-weight: 700;
  }
  .team-swatch:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .board {
    width: 100%;
    max-width: 880px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 1px 0 var(--border), 0 18px 40px -28px rgba(0,0,0,0.5);
    padding: clamp(18px, 3vw, 32px);
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 28px;
  }
  @media (max-width: 680px) {
    .board { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .board-row { flex-direction: column; align-items: center; }
    .team-panel { width: 100%; max-width: 420px; }
    .team-swatches { flex-direction: row; flex-wrap: wrap; }
    .team-swatch { flex: 1; justify-content: center; }
  }

  .points {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px 16px;
    margin: 0;
  }
  legend {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0 8px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-muted);
    display: inline-block;
  }
  legend.gun .dot { background: var(--focus); }
  legend.target .dot { background: var(--accent); }

  .coord-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  label.field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  label.field span {
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
  }
  input[type="number"] {
    font-family: "JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 17px;
    padding: 9px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    width: 100%;
  }
  input[type="number"]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  .presets {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .presets-actions {
    display: flex;
    gap: 8px;
  }
  .save-btn {
    flex: 1;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-contrast);
    border: 1px solid var(--accent);
  }
  .save-btn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .save-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .presets-footer {
    display: flex;
    justify-content: flex-end;
  }
  .clear-btn {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: none;
    border: none;
    color: var(--ink-muted);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 4px 2px;
  }
  .clear-btn:hover { color: var(--danger); }
  .clear-btn:disabled { opacity: 0.4; cursor: not-allowed; text-decoration: none; }
  .clear-btn.armed { color: var(--danger); text-decoration: none; font-weight: 700; }
  .field-label {
    display: block;
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 28px;
  }
  .chip-row:empty::before {
    content: 'None saved yet';
    font-size: 11.5px;
    font-style: italic;
    color: var(--ink-muted);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 999px;
    padding: 5px 5px 5px 9px;
    color: var(--ink);
    cursor: pointer;
  }
  .chip .chip-color {
    width: 18px;
    height: 18px;
    padding: 4px;
    border-radius: 50%;
    flex: none;
    cursor: pointer;
    background-clip: content-box;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .chip .chip-edit, .chip .chip-del {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    color: var(--ink-muted);
  }
  .chip .chip-edit:hover { background: var(--border); color: var(--ink); }
  .chip .chip-del:hover { background: var(--border); color: var(--danger); }
  .chip.active .chip-edit:hover, .chip.active .chip-del:hover { background: rgba(0,0,0,0.15); }
  .chip-editing {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px;
    background: var(--surface-2);
    border: 1px solid var(--focus);
    border-radius: 999px;
    padding: 4px 4px 4px 10px;
  }
  .chip-rename-input {
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px;
    border: none;
    background: transparent;
    color: var(--ink);
    outline: none;
    width: 110px;
  }

  .readout {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    padding: 20px 16px;
  }

  .rose-wrap { position: relative; width: 190px; height: 190px; }
  svg.rose { width: 190px; height: 190px; display: block; }
  .rose text {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 700;
    fill: var(--ink-muted);
  }
  .rose .ring { fill: none; stroke: var(--border); stroke-width: 1.5; }
  .rose .tick { stroke: var(--border); stroke-width: 1.5; }
  .rose .tick.major { stroke: var(--ink-muted); stroke-width: 2; }
  #needle {
    transform-origin: 95px 95px;
    transition: transform 0.35s cubic-bezier(.3,1.4,.4,1);
  }
  #needle .shaft { stroke: var(--needle); stroke-width: 3; stroke-linecap: round; }
  #needle .head { fill: var(--needle); }
  .hub { fill: var(--surface-2); stroke: var(--ink-muted); stroke-width: 1.5; }

  .results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }
  .result-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 9px;
    padding: 14px 12px 18px;
    text-align: center;
    box-shadow: 0 10px 22px -18px rgba(0,0,0,0.55);
  }
  .result-tile .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .result-tile .value {
    font-family: "JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(28px, 7vw, 34px);
    font-weight: 700;
    color: var(--accent);
    margin-top: 6px;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .result-tile .value small {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-muted);
    margin-left: 2px;
  }
  .same-point {
    grid-column: 1 / -1;
    font-size: 12.5px;
    color: var(--danger);
    text-align: center;
    min-height: 1.2em;
  }

  footer {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-muted);
    text-align: center;
    max-width: 500px;
  }

  @media (prefers-reduced-motion: reduce) {
    #needle { transition: none; }
  }
</style>
</head>
<body>

<div class="masthead">
  <p class="eyebrow">Wardogs &middot; L81 Mortar</p>
  <h1>MORTAR DISTANCE CALCULATOR</h1>
  <p>Enter the L81's grid position and the target's grid position.</p>
  <div class="controls">
    <div class="seg" role="group" aria-label="Theme">
      <button type="button" class="seg-btn" data-mode="light">Light</button>
      <button type="button" class="seg-btn" data-mode="dark">Dark</button>
    </div>
  </div>
</div>

<div class="board-row">
  <aside class="team-panel">
    <span class="field-label">My Team</span>
    <div class="team-swatches" id="team-swatches" role="group" aria-label="My team">
      <button type="button" class="team-swatch" data-team="blue"><span class="swatch-dot" style="background:#0042d0"></span>Lonestar</button>
      <button type="button" class="team-swatch" data-team="green"><span class="swatch-dot" style="background:#068100"></span>Manticore</button>
      <button type="button" class="team-swatch" data-team="red"><span class="swatch-dot" style="background:#d66969"></span>Valkyra</button>
    </div>
  </aside>
  <div class="board">
  <div class="points">
    <fieldset>
      <legend class="gun"><span class="dot"></span>Point A &middot; Gun Position</legend>
      <div class="coord-row">
        <label class="field"><span>X (east/west)</span><input type="number" id="ax" placeholder="0.00" step="0.01" inputmode="decimal"></label>
        <label class="field"><span>Y (north/south)</span><input type="number" id="ay" placeholder="0.00" step="0.01" inputmode="decimal"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend class="target"><span class="dot"></span>Point B &middot; Target</legend>
      <div class="coord-row">
        <label class="field"><span>X (east/west)</span><input type="number" id="bx" placeholder="0.00" step="0.01" inputmode="decimal"></label>
        <label class="field"><span>Y (north/south)</span><input type="number" id="by" placeholder="0.00" step="0.01" inputmode="decimal"></label>
      </div>
    </fieldset>

    <div class="presets">
      <div class="presets-actions">
        <button type="button" class="save-btn" id="save-preset">+ Save Points</button>
      </div>
      <div>
        <span class="field-label">Saved Mortars</span>
        <div class="chip-row" id="mortar-chips"></div>
      </div>
      <div>
        <span class="field-label">Saved Targets</span>
        <div class="chip-row" id="target-chips"></div>
      </div>
      <div class="presets-footer">
        <button type="button" class="clear-btn" id="clear-presets">Clear all</button>
      </div>
    </div>
  </div>

  <div class="readout">
    <div class="rose-wrap">
      <svg class="rose" viewBox="0 0 190 190">
        <circle class="ring" cx="95" cy="95" r="64"></circle>
        <g id="ticks"></g>
        <text x="95" y="16" text-anchor="middle">N</text>
        <text x="175" y="99" text-anchor="middle">E</text>
        <text x="95" y="179" text-anchor="middle">S</text>
        <text x="15" y="99" text-anchor="middle">W</text>
        <g id="needle">
          <line class="shaft" x1="95" y1="95" x2="95" y2="49"></line>
          <polygon class="head" points="95,43 89,55 101,55"></polygon>
        </g>
        <circle class="hub" cx="95" cy="95" r="5"></circle>
      </svg>
    </div>
    <div class="results">
      <div class="result-tile">
        <div class="label">Range</div>
        <div class="value" id="out-range">&mdash;</div>
      </div>
      <div class="result-tile">
        <div class="label">Bearing</div>
        <div class="value" id="out-bearing">&mdash;</div>
      </div>
      <div class="same-point" id="same-point"></div>
    </div>
  </div>
  </div>
</div>

<footer>Bearing measured clockwise from grid north</footer>

<script>
  (function () {
    const root = document.documentElement;
    const modeButtons = document.querySelectorAll('.seg-btn');

    function setActiveButtons() {
      const mode = root.getAttribute('data-theme');
      modeButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.mode === mode));
    }
    setActiveButtons();

    modeButtons.forEach((btn) => btn.addEventListener('click', () => {
      root.setAttribute('data-theme', btn.dataset.mode);
      try { localStorage.setItem('fmp-theme-mode', btn.dataset.mode); } catch (e) {}
      setActiveButtons();
      applyTeamAccent();
      renderChips();
    }));
  })();

  const ticksGroup = document.getElementById('ticks');
  for (let deg = 0; deg < 360; deg += 15) {
    const major = deg % 90 === 0;
    const rad = (deg - 90) * Math.PI / 180;
    const outer = 64, inner = major ? 54 : 58;
    const x1 = 95 + outer * Math.cos(rad), y1 = 95 + outer * Math.sin(rad);
    const x2 = 95 + inner * Math.cos(rad), y2 = 95 + inner * Math.sin(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', 'tick' + (major ? ' major' : ''));
    ticksGroup.appendChild(line);
  }

  const METERS_PER_UNIT = 100;
  const ax = document.getElementById('ax');
  const ay = document.getElementById('ay');
  const bx = document.getElementById('bx');
  const by = document.getElementById('by');
  const needle = document.getElementById('needle');
  const outRange = document.getElementById('out-range');
  const outBearing = document.getElementById('out-bearing');
  const samePoint = document.getElementById('same-point');
  const saveBtn = document.getElementById('save-preset');
  const clearBtn = document.getElementById('clear-presets');
  const mortarChipsEl = document.getElementById('mortar-chips');
  const targetChipsEl = document.getElementById('target-chips');

  const PRESETS_KEY = 'mdc-presets';
  let presets = { mortarCounter: 0, targetCounter: 0, mortars: [], targets: [] };
  try {
    const raw = localStorage.getItem(PRESETS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const legacyCounter = parsed.counter || 0;
      presets.mortarCounter = parsed.mortarCounter || legacyCounter;
      presets.targetCounter = parsed.targetCounter || legacyCounter;
      presets.mortars = Array.isArray(parsed.mortars) ? parsed.mortars : [];
      presets.targets = Array.isArray(parsed.targets) ? parsed.targets : [];
    }
  } catch (e) {}

  function findByCoords(list, x, y) {
    return list.find((entry) => entry.x === x && entry.y === y);
  }

  // Faction colors (Wardogs).
  const FACTIONS = {
    blue: { name: 'Lonestar', light: '#0042d0', lightStrong: '#0035a6', dark: '#5984e0', darkStrong: '#83a3e8' },
    green: { name: 'Manticore', light: '#068100', lightStrong: '#056700', dark: '#5dad59', darkStrong: '#86c283' },
    red: { name: 'Valkyra', light: '#d66969', lightStrong: '#ab5454', dark: '#e49e9e', darkStrong: '#ebb6b6' },
  };
  const FACTION_ORDER = ['blue', 'green', 'red'];
  const LIGHT_TEXT = '#fff8f0';
  const DARK_TEXT = '#0d2330';

  function isDarkTheme() {
    const theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'light') return false;
    if (theme === 'dark') return true;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  function factionOf(entry) {
    return FACTIONS[entry.color] || FACTIONS.blue;
  }

  const TEAM_KEY = 'mdc-team';
  let myTeam = 'blue';
  try {
    const savedTeam = localStorage.getItem(TEAM_KEY);
    if (FACTIONS[savedTeam]) myTeam = savedTeam;
  } catch (e) {}

  function nonTeamColors() {
    return FACTION_ORDER.filter((c) => c !== myTeam);
  }

  function applyTeamAccent() {
    const faction = FACTIONS[myTeam];
    const dark = isDarkTheme();
    const accent = dark ? faction.dark : faction.light;
    const style = document.documentElement.style;
    style.setProperty('--accent', accent);
    style.setProperty('--accent-strong', dark ? faction.darkStrong : faction.lightStrong);
    style.setProperty('--needle', accent);
  }
  applyTeamAccent();

  let activeMortarId = null;
  let activeTargetId = null;

  function savePresets() {
    try { localStorage.setItem(PRESETS_KEY, JSON.stringify(presets)); } catch (e) {}
  }

  function renderChipRow(container, list, activeId, editingId, onSelect, onDelete, onStartEdit, onCommitRename, onCancelEdit, onCycleColor) {
    container.innerHTML = '';
    const dark = isDarkTheme();
    list.forEach((entry) => {
      if (entry.id === editingId) {
        const editChip = document.createElement('span');
        editChip.className = 'chip-editing';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'chip-rename-input';
        input.value = entry.name;
        editChip.appendChild(input);

        const confirmBtn = document.createElement('span');
        confirmBtn.className = 'chip-edit';
        confirmBtn.textContent = '✓';
        confirmBtn.setAttribute('aria-label', 'Confirm rename');
        editChip.appendChild(confirmBtn);

        const cancelBtn = document.createElement('span');
        cancelBtn.className = 'chip-del';
        cancelBtn.textContent = '×';
        cancelBtn.setAttribute('aria-label', 'Cancel rename');
        editChip.appendChild(cancelBtn);

        const commit = () => onCommitRename(entry, input.value);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          else if (e.key === 'Escape') { e.preventDefault(); onCancelEdit(); }
        });
        input.addEventListener('click', (e) => e.stopPropagation());
        confirmBtn.addEventListener('click', (e) => { e.stopPropagation(); commit(); });
        cancelBtn.addEventListener('click', (e) => { e.stopPropagation(); onCancelEdit(); });

        container.appendChild(editChip);
        input.focus();
        input.select();
        return;
      }

      const faction = factionOf(entry);
      const isActive = entry.id === activeId;
      const fill = dark ? faction.dark : faction.light;
      const textColor = dark ? DARK_TEXT : LIGHT_TEXT;

      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (isActive ? ' active' : '');
      chip.title = `${faction.name} · X ${entry.x}, Y ${entry.y}`;
      chip.style.borderLeftColor = fill;
      if (isActive) {
        chip.style.background = fill;
        chip.style.borderColor = fill;
        chip.style.color = textColor;
      }

      const colorDot = document.createElement('span');
      colorDot.className = 'chip-color';
      colorDot.style.background = fill;
      colorDot.setAttribute('aria-label', `Change faction color for ${entry.name} (currently ${faction.name})`);
      colorDot.title = `${faction.name} — click to change`;
      chip.appendChild(colorDot);

      const label = document.createElement('span');
      label.textContent = entry.name;
      chip.appendChild(label);

      const edit = document.createElement('span');
      edit.className = 'chip-edit';
      edit.textContent = '✎';
      edit.setAttribute('aria-label', `Rename ${entry.name}`);
      chip.appendChild(edit);

      const del = document.createElement('span');
      del.className = 'chip-del';
      del.textContent = '×';
      del.setAttribute('aria-label', `Delete ${entry.name}`);
      chip.appendChild(del);

      chip.addEventListener('click', (e) => {
        if (e.target === del || e.target === edit || e.target === colorDot) return;
        onSelect(entry);
      });
      colorDot.addEventListener('click', (e) => {
        e.stopPropagation();
        onCycleColor(entry);
      });
      edit.addEventListener('click', (e) => {
        e.stopPropagation();
        onStartEdit(entry);
      });
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        onDelete(entry);
      });

      container.appendChild(chip);
    });
  }

  let editingId = null;

  function startEdit(entry) {
    editingId = entry.id;
    renderChips();
  }

  function cancelEdit() {
    editingId = null;
    renderChips();
  }

  function commitRename(entry, newName) {
    const trimmed = (newName || '').trim();
    if (trimmed) entry.name = trimmed;
    editingId = null;
    savePresets();
    renderChips();
  }

  function cycleMortarColor(entry) {
    const current = FACTION_ORDER.indexOf(entry.color);
    entry.color = FACTION_ORDER[(current + 1) % FACTION_ORDER.length];
    savePresets();
    renderChips();
  }

  function cycleTargetColor(entry) {
    const order = nonTeamColors();
    const current = order.indexOf(entry.color);
    entry.color = order[(current + 1) % order.length];
    savePresets();
    renderChips();
  }

  function renderChips() {
    renderChipRow(mortarChipsEl, presets.mortars, activeMortarId, editingId, (entry) => {
      ax.value = entry.x;
      ay.value = entry.y;
      activeMortarId = entry.id;
      renderChips();
      recalc();
    }, (entry) => {
      presets.mortars = presets.mortars.filter((m) => m.id !== entry.id);
      if (activeMortarId === entry.id) activeMortarId = null;
      savePresets();
      renderChips();
    }, startEdit, commitRename, cancelEdit, cycleMortarColor);

    renderChipRow(targetChipsEl, presets.targets, activeTargetId, editingId, (entry) => {
      bx.value = entry.x;
      by.value = entry.y;
      activeTargetId = entry.id;
      renderChips();
      recalc();
    }, (entry) => {
      presets.targets = presets.targets.filter((t) => t.id !== entry.id);
      if (activeTargetId === entry.id) activeTargetId = null;
      savePresets();
      renderChips();
    }, startEdit, commitRename, cancelEdit, cycleTargetColor);

    updateClearBtn();
  }

  function setMyTeam(color) {
    if (!FACTIONS[color] || color === myTeam) return;
    myTeam = color;
    try { localStorage.setItem(TEAM_KEY, color); } catch (e) {}
    presets.mortars.forEach((m) => { m.color = color; });
    savePresets();
    updateTeamButtons();
    applyTeamAccent();
    renderChips();
  }

  const teamButtons = document.querySelectorAll('.team-swatch');
  function updateTeamButtons() {
    teamButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.team === myTeam));
  }
  updateTeamButtons();
  teamButtons.forEach((btn) => btn.addEventListener('click', () => setMyTeam(btn.dataset.team)));

  saveBtn.addEventListener('click', () => {
    const x1 = parseFloat(ax.value), y1 = parseFloat(ay.value);
    const x2 = parseFloat(bx.value), y2 = parseFloat(by.value);
    const hasA = !Number.isNaN(x1) && !Number.isNaN(y1);
    const hasB = !Number.isNaN(x2) && !Number.isNaN(y2);
    if (!hasA && !hasB) return;

    if (hasA) {
      const existing = findByCoords(presets.mortars, x1, y1);
      if (existing) {
        activeMortarId = existing.id;
      } else {
        presets.mortarCounter += 1;
        const entry = { id: `m${presets.mortarCounter}`, name: `Mortar ${presets.mortarCounter}`, x: x1, y: y1, color: myTeam };
        presets.mortars.push(entry);
        activeMortarId = entry.id;
      }
    }

    if (hasB) {
      const existing = findByCoords(presets.targets, x2, y2);
      if (existing) {
        activeTargetId = existing.id;
      } else {
        presets.targetCounter += 1;
        const entry = { id: `t${presets.targetCounter}`, name: `Target ${presets.targetCounter}`, x: x2, y: y2, color: nonTeamColors()[0] };
        presets.targets.push(entry);
        activeTargetId = entry.id;
      }
    }

    savePresets();
    renderChips();
  });

  let clearArmed = false;
  let clearArmTimer = null;

  function updateClearBtn() {
    const empty = presets.mortars.length === 0 && presets.targets.length === 0;
    clearBtn.disabled = empty;
    clearBtn.textContent = clearArmed ? 'Click again to confirm' : 'Clear all';
    clearBtn.classList.toggle('armed', clearArmed);
  }

  clearBtn.addEventListener('click', () => {
    if (presets.mortars.length === 0 && presets.targets.length === 0) return;

    if (!clearArmed) {
      clearArmed = true;
      updateClearBtn();
      clearArmTimer = setTimeout(() => {
        clearArmed = false;
        updateClearBtn();
      }, 4000);
      return;
    }

    clearTimeout(clearArmTimer);
    clearArmed = false;
    presets = { mortarCounter: 0, targetCounter: 0, mortars: [], targets: [] };
    activeMortarId = null;
    activeTargetId = null;
    editingId = null;
    try { localStorage.removeItem(PRESETS_KEY); } catch (e) {}
    renderChips();
  });

  [ax, ay].forEach((el) => el.addEventListener('input', () => { activeMortarId = null; renderChips(); }));
  [bx, by].forEach((el) => el.addEventListener('input', () => { activeTargetId = null; renderChips(); }));

  function fmt(n, digits) {
    return n.toLocaleString(undefined, { maximumFractionDigits: digits, minimumFractionDigits: 0 });
  }

  function recalc() {
    const x1 = parseFloat(ax.value), y1 = parseFloat(ay.value);
    const x2 = parseFloat(bx.value), y2 = parseFloat(by.value);
    const hasA = !Number.isNaN(x1) && !Number.isNaN(y1);
    const hasB = !Number.isNaN(x2) && !Number.isNaN(y2);

    saveBtn.disabled = !hasA && !hasB;

    if (!hasA || !hasB) {
      outRange.textContent = '—';
      outBearing.textContent = '—';
      samePoint.textContent = '';
      return;
    }

    const dx = x2 - x1, dy = y2 - y1;

    if (dx === 0 && dy === 0) {
      outRange.textContent = '0 m';
      outBearing.textContent = '—';
      samePoint.textContent = 'Gun and target share a grid position.';
      return;
    }
    samePoint.textContent = '';

    const distance = Math.hypot(dx, dy) * METERS_PER_UNIT;
    const bearing = ((Math.atan2(dx, dy) * 180 / Math.PI) + 360) % 360;

    outRange.textContent = distance >= 1000
      ? `${fmt(distance / 1000, 2)} km`
      : `${fmt(distance, 1)} m`;
    outBearing.textContent = `${fmt(bearing, 1)}°`;

    needle.style.transform = `rotate(${bearing}deg)`;
  }

  [ax, ay, bx, by].forEach(el => el.addEventListener('input', recalc));
  recalc();
  renderChips();
</script>
</body>
</html>
